<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GUANZI — 品牌视觉 / 平面设计</title>
<meta name="description" content="GUANZI，品牌视觉与平面设计。">
<style>
  :root{
    --bg:#0b0b0c; --ink:#f2f2f0; --dim:#8a8a86; --line:#242426; --neon:#c8ff2e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:28px 22px;
  }
  main{width:100%; max-width:390px}
  .eyebrow{
    font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim);
    display:flex; align-items:center; gap:8px; margin-bottom:26px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon)}
  h1{
    font-size:clamp(38px,13vw,54px); line-height:.96; margin:0 0 10px;
    letter-spacing:-.03em; font-weight:600;
  }
  h1 span{display:block}
  .cn{font-size:15px;line-height:1.7;color:var(--dim);margin:0 0 30px}
  .rule{height:1px;background:var(--line);margin:0 0 22px}
  .links{display:flex;flex-direction:column}
  .links a{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:15px 0;border-bottom:1px solid var(--line);
    color:var(--ink);text-decoration:none;font-size:14px;
  }
  .links a:last-child{border-bottom:0}
  .links span.k{color:var(--dim);font-size:12px;letter-spacing:.08em}
  .links a:active{color:var(--neon)}
  footer{margin-top:34px;font-size:11px;color:#5d5d5a;letter-spacing:.06em}
</style>
</head>
<body>
<main>
  <div class="eyebrow"><i class="dot"></i>GUANZI · EST. 1999</div>
  <h1><span>品牌视觉</span><span>平面设计</span></h1>
  <p class="cn">标识、包装、印刷落地。<br>昆山 / 昆明 · 可远程。</p>
  <div class="rule"></div>
  <nav class="links">
    <a href="https://heipadesign.info" target="_blank" rel="noopener">作品集 <span class="k">PORTFOLIO ↗</span></a>
    <a href="https://x.com/guanzi_ao" target="_blank" rel="noopener">X / Twitter <span class="k">@guanzi_ao ↗</span></a>
  </nav>
  <footer>GUANZI.LOC.CC — 占位页</footer>
</main>
</body>
</html>
